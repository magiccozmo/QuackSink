print("""\nSPIFFY'S GIFT - SGGE2.0\nLoading game bundle: sgge2.tar.gz\nPygbag-compatible static website / Python 3.13 WebAssembly\n""")

import sys
import asyncio
import platform
from pathlib import Path

async def custom_site():
    import embed
    platform.document.body.style.background = "#171321"
    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"
    bundle = "sgge2"
    appdir = Path(f"/data/data/{bundle}")
    appdir.mkdir()

    # Mirror the upstream Pygbag default template for static web hosting.
    # The compressed tarball is used on Cloudflare and localhost, not extracted by a server.
    if platform.window.location.host.find('.itch.zone') > 0:
        import zipfile
        async with platform.fopen("sgge2.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as z:
                z.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("sgge2.tar.gz", "rb") as archive:
            t = tarfile.open(fileobj=archive, mode="r:gz")
            t.extractall(path=appdir.as_posix(), filter='tar')
            t.close()

    platform.run_main(PyConfig, loaderhome=appdir / "assets", loadermain=None)
    while embed.counter() < 0:
        await asyncio.sleep(.1)
    main = appdir / "assets" / "main.py"

    if not platform.window.MM.UME:
        __import__(__name__).__file__ = main
        msg = "Ready to play! Click or tap anywhere to begin."
        platform.window.infobox.innerText = msg
        print(msg)
        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)
    __import__(__name__).__file__ = main

    def ui_callback(pkg):
        platform.window.infobox.innerText = f"Installing {pkg}"

    await shell.source(main, callback=ui_callback)
    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("SGGE2.0 loaded")
    shell.interactive()

asyncio.run(custom_site())
