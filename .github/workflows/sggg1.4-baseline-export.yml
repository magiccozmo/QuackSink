name: SGGG1.4 baseline export

on:
  push:
    branches:
      - temp/sggg1.4-g15-baseline-export-20261106

permissions:
  contents: read

jobs:
  export-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact baseline branch
        uses: actions/checkout@v4

      - name: Stage and verify the original G1.4 archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sggg1.4-baseline
          cp "ARCHIVES 8-30-2026/SGG/sggweb/SGGG1.4_SOURCE.zip" .sggg1.4-baseline/
          cp "ARCHIVES 8-30-2026/SGG/sggweb/SGGG1.4_COMPLETE_CLOUDFLARE_SITE.zip" .sggg1.4-baseline/
          cd .sggg1.4-baseline
          test -s SGGG1.4_SOURCE.zip
          test -s SGGG1.4_COMPLETE_CLOUDFLARE_SITE.zip
          unzip -t SGGG1.4_SOURCE.zip
          unzip -t SGGG1.4_COMPLETE_CLOUDFLARE_SITE.zip
          {
            echo "Baseline: SGGG1.4"
            echo "Repository commit: $GITHUB_SHA"
            stat -c '%n %s bytes' *.zip
            sha256sum *.zip
          } > BASELINE_MANIFEST.txt
          cat BASELINE_MANIFEST.txt

      - name: Upload original archives
        uses: actions/upload-artifact@v4
        with:
          name: SGGG1.4-baseline-transfer
          path: .sggg1.4-baseline/
          if-no-files-found: error
          retention-days: 1
