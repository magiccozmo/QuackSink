name: Temporary SGGG1.4 baseline export
on:
  push:
    branches:
      - temp/sggg1.4-g15-baseline-export-20261106
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ARCHIVES 8-30-2026/SGG/sggweb/SGGG1.4_SOURCE.zip
            ARCHIVES 8-30-2026/SGG/sggweb/SGGG1.4_COMPLETE_CLOUDFLARE_SITE.zip
            ARCHIVES 8-30-2026/SGG/sggweb/SGGG1.4_GLOBAL_LOG_WORKER.js
            ARCHIVES 8-30-2026/SGG/sggweb/SGGG1.4_LUMA_LOG_Entry028.txt
          sparse-checkout-cone-mode: false
      - name: Verify and stage exact G1.4 baseline
        shell: bash
        run: |
          set -euo pipefail
          base="ARCHIVES 8-30-2026/SGG/sggweb"
          mkdir -p /tmp/sggg14
          cp "$base/SGGG1.4_SOURCE.zip" /tmp/sggg14/
          cp "$base/SGGG1.4_COMPLETE_CLOUDFLARE_SITE.zip" /tmp/sggg14/
          cp "$base/SGGG1.4_GLOBAL_LOG_WORKER.js" /tmp/sggg14/
          cp "$base/SGGG1.4_LUMA_LOG_Entry028.txt" /tmp/sggg14/
          test -s /tmp/sggg14/SGGG1.4_SOURCE.zip
          test -s /tmp/sggg14/SGGG1.4_COMPLETE_CLOUDFLARE_SITE.zip
          unzip -t /tmp/sggg14/SGGG1.4_SOURCE.zip
          unzip -t /tmp/sggg14/SGGG1.4_COMPLETE_CLOUDFLARE_SITE.zip
          {
            echo "Baseline: SGGG1.4"
            echo "Repository commit: $GITHUB_SHA"
            stat -c '%n %s bytes' /tmp/sggg14/*
            sha256sum /tmp/sggg14/*
          } > /tmp/sggg14/BASELINE_MANIFEST.txt
          cat /tmp/sggg14/BASELINE_MANIFEST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SGGG1.4-baseline-export-sparse
          path: /tmp/sggg14/*
          retention-days: 2
