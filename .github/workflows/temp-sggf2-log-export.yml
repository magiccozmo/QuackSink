name: Temporary SGGF2 cumulative Luma log export
on:
  push:
    branches:
      - temp/sggf2-baseline-export-20261104
permissions:
  contents: read
  actions: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            TEMP_EXPORT/SGGF2.0_lumas_log_Entry022.txt
          sparse-checkout-cone-mode: false
      - name: Verify cumulative log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sgg-log
          cp TEMP_EXPORT/SGGF2.0_lumas_log_Entry022.txt /tmp/sgg-log/
          test -s /tmp/sgg-log/SGGF2.0_lumas_log_Entry022.txt
          grep -q 'END ENTRY 021' /tmp/sgg-log/SGGF2.0_lumas_log_Entry022.txt
          grep -q 'END ENTRY 022' /tmp/sgg-log/SGGF2.0_lumas_log_Entry022.txt
          wc -c /tmp/sgg-log/SGGF2.0_lumas_log_Entry022.txt | tee /tmp/sgg-log/FILE_SIZE.txt
          sha256sum /tmp/sgg-log/SGGF2.0_lumas_log_Entry022.txt | tee /tmp/sgg-log/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SGGF2.0-Luma-Log-Entry022
          path: /tmp/sgg-log/
          retention-days: 1
          if-no-files-found: error
