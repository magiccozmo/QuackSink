name: SGGK1.5 baseline transfer
on:
  push:
    branches:
      - transfer/sggk15-baseline-20261110
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact baseline commit
        uses: actions/checkout@v4
      - name: Stage and verify original K1.5 archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          cp "ARCHIVES 8-30-2026/SGG/sggweb/SGGK1.5_SOURCE.zip" transfer/
          cp "ARCHIVES 8-30-2026/SGG/sggweb/SGGK1.5_COMPLETE_CLOUDFLARE_SITE.zip" transfer/
          test -s transfer/SGGK1.5_SOURCE.zip
          test -s transfer/SGGK1.5_COMPLETE_CLOUDFLARE_SITE.zip
          unzip -t transfer/SGGK1.5_SOURCE.zip
          unzip -t transfer/SGGK1.5_COMPLETE_CLOUDFLARE_SITE.zip
          {
            stat -c '%n %s bytes' transfer/*.zip
            sha256sum transfer/*.zip
          } | tee transfer/BASELINE_CHECKSUMS.txt
      - name: Upload verified baseline archives
        uses: actions/upload-artifact@v4
        with:
          name: SGGK1.5-baseline-transfer
          path: transfer/
          retention-days: 1
          if-no-files-found: error
