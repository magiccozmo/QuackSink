name: Temporary SGGF1Clean2.14 sparse baseline export

on:
  push:
    branches:
      - temp/sggf1almost-sparse-export-20261104

permissions:
  contents: read
  actions: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out only the exact baseline ZIPs
        uses: actions/checkout@v4
        with:
          ref: temp/sggf1almost-sparse-export-20261104
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ARCHIVES 8-30-2026/SGG/sggweb/SGGF1Clean2.14_SOURCE.zip
            ARCHIVES 8-30-2026/SGG/sggweb/SGGF1Clean2.14_COMPLETE_CLOUDFLARE_SITE.zip
          sparse-checkout-cone-mode: false
      - name: Stage and verify exact Clean2.14 packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sgg-transfer
          cp "ARCHIVES 8-30-2026/SGG/sggweb/SGGF1Clean2.14_SOURCE.zip" /tmp/sgg-transfer/
          cp "ARCHIVES 8-30-2026/SGG/sggweb/SGGF1Clean2.14_COMPLETE_CLOUDFLARE_SITE.zip" /tmp/sgg-transfer/
          test -s /tmp/sgg-transfer/SGGF1Clean2.14_SOURCE.zip
          test -s /tmp/sgg-transfer/SGGF1Clean2.14_COMPLETE_CLOUDFLARE_SITE.zip
          unzip -tq /tmp/sgg-transfer/SGGF1Clean2.14_SOURCE.zip
          unzip -tq /tmp/sgg-transfer/SGGF1Clean2.14_COMPLETE_CLOUDFLARE_SITE.zip
          (cd /tmp/sgg-transfer && sha256sum *.zip | tee SHA256SUMS.txt)
          (cd /tmp/sgg-transfer && wc -c *.zip | tee FILE_SIZES.txt)
      - name: Upload original project ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: SGGF1Clean2.14-exact-baseline-sparse
          path: /tmp/sgg-transfer/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
