name: Temporary K1.12 map-source export
on:
  push:
    branches:
      - luma-j112-map-export
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: luma-j112-map-export
          lfs: true
      - name: Stage and verify K1.12 archives
        run: |
          set -euo pipefail
          mkdir -p transfer
          cp "ARCHIVES 8-30-2026/SGG/sggweb/SGGK1.12_SOURCE.zip" transfer/
          cp "ARCHIVES 8-30-2026/SGG/sggweb/SGGK1.12_COMPLETE_CLOUDFLARE_SITE.zip" transfer/
          test -s transfer/SGGK1.12_SOURCE.zip
          test -s transfer/SGGK1.12_COMPLETE_CLOUDFLARE_SITE.zip
          unzip -t transfer/SGGK1.12_SOURCE.zip
          unzip -t transfer/SGGK1.12_COMPLETE_CLOUDFLARE_SITE.zip
          sha256sum transfer/*.zip | tee transfer/SHA256SUMS.txt
          stat -c '%n %s bytes' transfer/*.zip | tee transfer/SIZES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SGGK1.12-map-baseline
          path: transfer/
          retention-days: 1
