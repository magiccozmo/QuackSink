name: SGG H1.1 Deployment Only

on:
  push:
    branches:
      - tmp/sgg-h1-1-deploy-only-20261107
    paths:
      - tmp/sgg-h1-1-deploy-trigger.txt
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ARCHIVES 8-30-2026/SGG/sggweb/SGGH1.0_COMPLETE_CLOUDFLARE_SITE.zip
            ARCHIVES 8-30-2026/SGG/sggweb/audio_clip/kartlotta_meet.wav
          sparse-checkout-cone-mode: false

      - name: Build the deployment tree from H1.0 and add the repo WAV
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib
          import shutil

          base = Path("ARCHIVES 8-30-2026/SGG/sggweb/SGGH1.0_COMPLETE_CLOUDFLARE_SITE.zip")
          wav = Path("ARCHIVES 8-30-2026/SGG/sggweb/audio_clip/kartlotta_meet.wav")
          dist = Path("dist")
          verify = Path("/tmp/SGGH1.1_DEPLOY_VERIFY.zip")

          if not base.is_file():
              raise SystemExit(f"Missing H1.0 deployment baseline: {base}")
          if not wav.is_file():
              raise SystemExit(f"Missing repo WAV: {wav}")
          if dist.exists():
              shutil.rmtree(dist)
          dist.mkdir()

          with ZipFile(base, "r") as zin:
              bad = zin.testzip()
              if bad:
                  raise SystemExit(f"Baseline ZIP CRC failure: {bad}")
              if "audio_clip/.gitkeep" not in zin.namelist() and "audio_clip/" not in zin.namelist():
                  raise SystemExit("Baseline deployment has no root audio_clip folder.")
              zin.extractall(dist)

          audio_path = dist / "audio_clip" / "kartlotta_meet.wav"
          audio_path.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(wav, audio_path)

          front_page = dist / "index.html"
          if not front_page.is_file():
              raise SystemExit("Deployment front page index.html is missing.")
          page = front_page.read_bytes()
          old_label = b'<span class="current-version">SGGH1.0</span>'
          new_label = b'<span class="current-version">SGGH1.1</span>'
          if page.count(old_label) != 1:
              raise SystemExit(f"Expected exactly one H1.0 front-page label, found {page.count(old_label)}.")
          front_page.write_bytes(page.replace(old_label, new_label, 1))

          files = sorted(p for p in dist.rglob("*") if p.is_file())
          with ZipFile(verify, "w", ZIP_DEFLATED, compresslevel=6) as zout:
              for path in files:
                  zout.write(path, path.relative_to(dist).as_posix())
          with ZipFile(verify, "r") as check:
              bad = check.testzip()
              if bad:
                  raise SystemExit(f"Deployment tree ZIP CRC failure: {bad}")
              if "audio_clip/kartlotta_meet.wav" not in check.namelist():
                  raise SystemExit("WAV missing from deployment root.")
              info = check.getinfo("audio_clip/kartlotta_meet.wav")
              if info.file_size != wav.stat().st_size:
                  raise SystemExit("WAV size mismatch in deployment tree.")
          if b'<span class="current-version">SGGH1.1</span>' not in front_page.read_bytes():
              raise SystemExit("Front-page version label did not update.")
          print(f"Copied H1.0 deployment tree: {len(files)-1} existing entries preserved.")
          print(f"Added audio_clip/kartlotta_meet.wav: {audio_path.stat().st_size} bytes")
          print("Updated index.html Browser Edition Archive current-version label to SGGH1.1.")
          print(f"Deploy tree entries: {len(files)}")
          print(f"Verified deploy ZIP size: {verify.stat().st_size} bytes")
          print(f"Verified deploy ZIP SHA256: {hashlib.sha256(verify.read_bytes()).hexdigest()}")
          print("Verified deploy root entries:", ", ".join(sorted(p.name for p in dist.iterdir())))
          PY

      - name: Publish the deploy tree as a deploy-ready ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: SGGH1.1_COMPLETE_CLOUDFLARE_SITE_DEPLOY_READY
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
