name: Luma K1.12 map transfer
on:
  push:
    branches: [luma-k112-map-transfer]
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            ARCHIVES 8-30-2026/SGG/sggweb/SGGK1.12_COMPLETE_CLOUDFLARE_SITE.zip
            ARCHIVES 8-30-2026/SGG/sggweb/SGGK1.11_SOURCE.zip
            ARCHIVES 8-30-2026/SGG/sggweb/SGGK1.12_SHA256SUMS.txt
          sparse-checkout-cone-mode: false
          lfs: true
      - name: Verify archives
        run: |
          unzip -t "ARCHIVES 8-30-2026/SGG/sggweb/SGGK1.12_COMPLETE_CLOUDFLARE_SITE.zip" >/dev/null
          unzip -t "ARCHIVES 8-30-2026/SGG/sggweb/SGGK1.11_SOURCE.zip" >/dev/null
          sha256sum "ARCHIVES 8-30-2026/SGG/sggweb/SGGK1.12_COMPLETE_CLOUDFLARE_SITE.zip" "ARCHIVES 8-30-2026/SGG/sggweb/SGGK1.11_SOURCE.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SGGK1.12-map-inputs
          path: |
            ARCHIVES 8-30-2026/SGG/sggweb/SGGK1.12_COMPLETE_CLOUDFLARE_SITE.zip
            ARCHIVES 8-30-2026/SGG/sggweb/SGGK1.11_SOURCE.zip
            ARCHIVES 8-30-2026/SGG/sggweb/SGGK1.12_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
