name: Temporary Clean2.8 baseline export
on:
  push:
    branches:
      - temp/export-clean28-baseline-20261103
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact pinned Clean2.8 packages and cumulative log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          BASE="https://raw.githubusercontent.com/magiccozmo/QuackSink/664b2a68d83fb45268c9881f1fc36079a7639dad/ARCHIVES%208-30-2026/SGG/sggweb"
          curl -fL --retry 3 "$BASE/SGGF1Clean2.8_SOURCE.zip" -o stage/SGGF1Clean2.8_SOURCE.zip
          curl -fL --retry 3 "$BASE/SGGF1Clean2.8_COMPLETE_CLOUDFLARE_SITE.zip" -o stage/SGGF1Clean2.8_COMPLETE_CLOUDFLARE_SITE.zip
          curl -fL --retry 3 "$BASE/lumas_log_Entry013.txt" -o stage/lumas_log_Entry013.txt
          test -s stage/SGGF1Clean2.8_SOURCE.zip
          test -s stage/SGGF1Clean2.8_COMPLETE_CLOUDFLARE_SITE.zip
          test -s stage/lumas_log_Entry013.txt
          unzip -tq stage/SGGF1Clean2.8_SOURCE.zip
          unzip -tq stage/SGGF1Clean2.8_COMPLETE_CLOUDFLARE_SITE.zip
          (cd stage && sha256sum *.zip *.txt > SHA256SUMS.txt && stat -c '%n %s bytes' *.zip *.txt > FILE_SIZES.txt)
          cat stage/SHA256SUMS.txt
          cat stage/FILE_SIZES.txt
      - name: Preserve exact originals for development
        uses: actions/upload-artifact@v4
        with:
          name: Clean2.8-exact-baseline-transfer
          path: stage/
          retention-days: 1
