name: Temporary SGGM1.3 Dropbox delivery bundle

on:
  push:
    branches:
      - luma-sggm13-dropbox-bundle-20261117
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out only the M1.1 archive inputs and builder
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            ARCHIVES 8-30-2026/SGG/sggweb/SGGM1.1_SOURCE.zip
            ARCHIVES 8-30-2026/SGG/sggweb/SGGM1.1_COMPLETE_CLOUDFLARE_SITE.zip
            scripts/luma_build_sggm13_dropbox.py
          sparse-checkout-cone-mode: false
      - name: Verify exact M1.1 archives
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "ARCHIVES 8-30-2026/SGG/sggweb/SGGM1.1_SOURCE.zip" >/dev/null
          unzip -t "ARCHIVES 8-30-2026/SGG/sggweb/SGGM1.1_COMPLETE_CLOUDFLARE_SITE.zip" >/dev/null
      - name: Build M1.3 delivery from M1.1
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: python3 scripts/luma_build_sggm13_dropbox.py
      - name: Upload Dropbox delivery files as one download bundle
        uses: actions/upload-artifact@v4
        with:
          name: SGGM1.3-Dropbox-Delivery
          path: ${{ runner.temp }}/delivery/*
          if-no-files-found: error
          retention-days: 1
