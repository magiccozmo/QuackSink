name: Export F1p gallery baseline
on:
  push:
    branches:
      - transfer/f1p-gallery-baseline-export-20261102
    paths:
      - .github/workflows/export-f1p-gallery-baseline.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact F1p baseline
        uses: actions/checkout@v4
      - name: Stage and verify original F1p packages
        shell: bash
        run: |
          set -euo pipefail
          ROOT="ARCHIVES 8-30-2026/SGG/sggweb"
          mkdir -p transfer
          cp "$ROOT/SGGF1.666f1p_SOURCE.zip" transfer/
          cp "$ROOT/SGGF1.666f1p_COMPLETE_CLOUDFLARE_SITE.zip" transfer/
          test -s transfer/SGGF1.666f1p_SOURCE.zip
          test -s transfer/SGGF1.666f1p_COMPLETE_CLOUDFLARE_SITE.zip
          unzip -t transfer/SGGF1.666f1p_SOURCE.zip
          unzip -t transfer/SGGF1.666f1p_COMPLETE_CLOUDFLARE_SITE.zip
          sha256sum transfer/* > transfer/SHA256SUMS.txt
          stat -c '%n %s bytes' transfer/* > transfer/SIZES.txt
          file transfer/*
      - name: Upload exact original packages
        uses: actions/upload-artifact@v4
        with:
          name: SGGF1p-gallery-baseline-transfer
          path: transfer/
          if-no-files-found: error
          retention-days: 1
