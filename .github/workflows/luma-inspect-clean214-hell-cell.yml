name: Luma inspect Clean2.14 HELLgs source
on:
  push:
    branches:
      - luma-inspect-clean214-hell-cell-20261104
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pinned repository tree
        uses: actions/checkout@v4
      - name: Extract and inspect Clean2.14 source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="ARCHIVES 8-30-2026/SGG/sggweb/SGGF1Clean2.14_SOURCE.zip"
          mkdir -p inspect/source
          test -s "$SOURCE"
          unzip -t "$SOURCE" > inspect/zip-test.txt
          unzip -q "$SOURCE" -d inspect/source
          find inspect/source -type f -printf '%s bytes\t%p\n' | sort -nr > inspect/file-list.txt
          grep -RInaE 'cozmo_death_reload_count|cozmo_hint_stage|death.reload|hint.stage|HELLGS QUICKLOAD|COZMO HINTS|COZMO CAMEO|No quick save|QUICKLOAD|RESPAWN' inspect/source > inspect/source-matches.txt || true
          grep -RIlE 'cozmo_death_reload_count|cozmo_hint_stage|HELLGS QUICKLOAD|COZMO HINTS|QUICKLOAD' inspect/source > inspect/matching-files.txt || true
          du -sh inspect/source > inspect/extracted-size.txt
          sha256sum "$SOURCE" > inspect/source-sha256.txt
          find inspect/source -type f \( -iname '*.js' -o -iname '*.html' -o -iname '*.py' -o -iname '*.json' \) -printf '%s bytes\t%p\n' | sort -nr > inspect/code-file-list.txt
      - name: Upload inspection bundle
        uses: actions/upload-artifact@v4
        with:
          name: clean214-hell-cell-source-inspection
          path: inspect/
          retention-days: 1
          if-no-files-found: error
