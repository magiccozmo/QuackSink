name: Temporary Clean2.10 exact baseline export
on:
  push:
    branches:
      - luma-clean2-11-export-20261103
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve exact pinned Clean2.10 files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          BASE="https://raw.githubusercontent.com/magiccozmo/QuackSink/883abc88f7292e1a5b4706070d164588b0c8ab90/ARCHIVES%208-30-2026/SGG/sggweb"
          curl -fL --retry 3 "$BASE/SGGF1Clean2.10_SOURCE.zip" -o transfer/SGGF1Clean2.10_SOURCE.zip
          curl -fL --retry 3 "$BASE/SGGF1Clean2.10_COMPLETE_CLOUDFLARE_SITE.zip" -o transfer/SGGF1Clean2.10_COMPLETE_CLOUDFLARE_SITE.zip
          curl -fL --retry 3 "$BASE/lumas_log_Entry015.txt" -o transfer/lumas_log_Entry015.txt
          curl -fL --retry 3 "$BASE/pics/alch%20recipe.png" -o "transfer/alch recipe.png"
          test "$(stat -c%s transfer/SGGF1Clean2.10_SOURCE.zip)" = "91739864"
          test "$(stat -c%s transfer/SGGF1Clean2.10_COMPLETE_CLOUDFLARE_SITE.zip)" = "24140511"
          echo "0e181808cb65e41d3af642fb41392b85e0b10c3a116a46b1084850a71f9333b6  transfer/SGGF1Clean2.10_SOURCE.zip" | sha256sum -c -
          echo "84ae26d1cbb2c0206cd4d49a8a66247e3a51dbb31d0843a7ae50ff083c918af5  transfer/SGGF1Clean2.10_COMPLETE_CLOUDFLARE_SITE.zip" | sha256sum -c -
          unzip -tq transfer/SGGF1Clean2.10_SOURCE.zip
          unzip -tq transfer/SGGF1Clean2.10_COMPLETE_CLOUDFLARE_SITE.zip
      - uses: actions/upload-artifact@v4
        with:
          name: clean2.10-source
          path: transfer/SGGF1Clean2.10_SOURCE.zip
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: clean2.10-deployment
          path: transfer/SGGF1Clean2.10_COMPLETE_CLOUDFLARE_SITE.zip
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: clean2.10-context
          path: |
            transfer/lumas_log_Entry015.txt
            transfer/alch recipe.png
          retention-days: 1
