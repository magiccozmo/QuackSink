name: Temporary F1m baseline export

on:
  push:
    branches:
      - transfer/f1m-baseline-export-20261102
    paths:
      - .github/workflows/export-f1m.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact branch commit
        uses: actions/checkout@v4
        with:
          ref: transfer/f1m-baseline-export-20261102
          fetch-depth: 1

      - name: Verify and stage the two F1m archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/f1m-export
          SOURCE="ARCHIVES 8-30-2026/SGG/sggweb/SGGF1.666f1m_SOURCE.zip"
          DEPLOY="ARCHIVES 8-30-2026/SGG/sggweb/SGGF1.666f1m_COMPLETE_CLOUDFLARE_SITE.zip"
          test -s "$SOURCE"
          test -s "$DEPLOY"
          cp "$SOURCE" /tmp/f1m-export/
          cp "$DEPLOY" /tmp/f1m-export/
          unzip -t /tmp/f1m-export/SGGF1.666f1m_SOURCE.zip
          unzip -t /tmp/f1m-export/SGGF1.666f1m_COMPLETE_CLOUDFLARE_SITE.zip
          cd /tmp/f1m-export
          sha256sum *.zip > SHA256SUMS.txt
          stat -c '%n %s bytes' *.zip > FILES.txt
          cat FILES.txt
          cat SHA256SUMS.txt

      - name: Publish short-lived transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SGGF1m-baseline-transfer
          path: /tmp/f1m-export/
          if-no-files-found: error
          retention-days: 1
