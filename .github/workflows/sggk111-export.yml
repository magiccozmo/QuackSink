name: Temporary SGGK1.11 baseline transfer

on:
  push:
    branches:
      - tmp/sggk111-transfer-20261116-2043

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out only the exact K1.11 baseline archives
        uses: actions/checkout@v4
        with:
          lfs: true
          sparse-checkout: |
            ARCHIVES 8-30-2026/SGG/sggweb/SGGK1.11_SOURCE.zip
            ARCHIVES 8-30-2026/SGG/sggweb/SGGK1.11_COMPLETE_CLOUDFLARE_SITE.zip
          sparse-checkout-cone-mode: false

      - name: Stage and verify original K1.11 archives
        shell: bash
        run: |
          set -euo pipefail
          SRC="ARCHIVES 8-30-2026/SGG/sggweb/SGGK1.11_SOURCE.zip"
          SITE="ARCHIVES 8-30-2026/SGG/sggweb/SGGK1.11_COMPLETE_CLOUDFLARE_SITE.zip"
          mkdir -p transfer
          test -s "$SRC"
          test -s "$SITE"
          cp "$SRC" transfer/
          cp "$SITE" transfer/
          unzip -t "transfer/SGGK1.11_SOURCE.zip"
          unzip -t "transfer/SGGK1.11_COMPLETE_CLOUDFLARE_SITE.zip"
          {
            stat -c '%n %s bytes' transfer/*.zip
            sha256sum transfer/*.zip
          } | tee transfer/BASELINE_CHECKSUMS.txt

      - name: Upload baseline transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SGGK1.11-baseline-transfer
          path: transfer/
          if-no-files-found: error
          retention-days: 1
