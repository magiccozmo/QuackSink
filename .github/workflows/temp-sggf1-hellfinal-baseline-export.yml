name: Temporary SGGF1.666almost exact baseline export

on:
  push:
    branches:
      - temp/sggf1-hellfinal-baseline-export-20261104

permissions:
  contents: read
  actions: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out only the exact tested baseline ZIPs
        uses: actions/checkout@v4
        with:
          ref: temp/sggf1-hellfinal-baseline-export-20261104
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ARCHIVES 8-30-2026/SGG/sggweb/SGGF1.666almost_SOURCE.zip
            ARCHIVES 8-30-2026/SGG/sggweb/SGGF1.666almost_COMPLETE_CLOUDFLARE_SITE.zip
          sparse-checkout-cone-mode: false
      - name: Stage and verify exact 1.666almost packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sgg-transfer
          cp "ARCHIVES 8-30-2026/SGG/sggweb/SGGF1.666almost_SOURCE.zip" /tmp/sgg-transfer/
          cp "ARCHIVES 8-30-2026/SGG/sggweb/SGGF1.666almost_COMPLETE_CLOUDFLARE_SITE.zip" /tmp/sgg-transfer/
          test -s /tmp/sgg-transfer/SGGF1.666almost_SOURCE.zip
          test -s /tmp/sgg-transfer/SGGF1.666almost_COMPLETE_CLOUDFLARE_SITE.zip
          unzip -tq /tmp/sgg-transfer/SGGF1.666almost_SOURCE.zip
          unzip -tq /tmp/sgg-transfer/SGGF1.666almost_COMPLETE_CLOUDFLARE_SITE.zip
          (cd /tmp/sgg-transfer && sha256sum *.zip | tee SHA256SUMS.txt)
          (cd /tmp/sgg-transfer && wc -c *.zip | tee FILE_SIZES.txt)
      - name: Upload original project ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: SGGF1.666almost-exact-baseline
          path: /tmp/sgg-transfer/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
