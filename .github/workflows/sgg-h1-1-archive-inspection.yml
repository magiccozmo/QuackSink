name: Temporary H1.1 archive inspection

on:
  push:
    branches:
      - tmp/sgg-h1-1-archive-inspection-20261107

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact H1.1 and H1.0 archives only
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            ARCHIVES 8-30-2026/SGG/sggweb/SGGH1.1_COMPLETE_CLOUDFLARE_SITE.zip
            ARCHIVES 8-30-2026/SGG/sggweb/SGGH1.1_COMPLETE_CLOUDFLARE_SITE_DEPLOY_READY.zip
          sparse-checkout-cone-mode: false
      - name: Check and stage exact archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          cp "ARCHIVES 8-30-2026/SGG/sggweb/SGGH1.1_COMPLETE_CLOUDFLARE_SITE.zip" transfer/
          cp "ARCHIVES 8-30-2026/SGG/sggweb/SGGH1.1_COMPLETE_CLOUDFLARE_SITE_DEPLOY_READY.zip" transfer/
          unzip -t transfer/SGGH1.1_COMPLETE_CLOUDFLARE_SITE.zip
          unzip -t transfer/SGGH1.1_COMPLETE_CLOUDFLARE_SITE_DEPLOY_READY.zip
          unzip -l transfer/SGGH1.1_COMPLETE_CLOUDFLARE_SITE.zip > transfer/UNSUFFIXED_INVENTORY.txt
          unzip -l transfer/SGGH1.1_COMPLETE_CLOUDFLARE_SITE_DEPLOY_READY.zip > transfer/DEPLOY_READY_INVENTORY.txt
          sha256sum transfer/*.zip > transfer/SHA256SUMS.txt
          stat -c '%n %s bytes' transfer/*.zip > transfer/FILE_SIZES.txt
      - name: Upload inspection bundle
        uses: actions/upload-artifact@v4
        with:
          name: SGGH1.1-archive-inspection
          path: transfer/
          retention-days: 1
          if-no-files-found: error
