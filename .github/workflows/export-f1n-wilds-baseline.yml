name: Export F1n Wilds baseline
on:
  push:
    branches:
      - transfer/f1n-wilds-baseline-export-20261102
    paths:
      - .github/workflows/export-f1n-wilds-baseline.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact baseline branch
        uses: actions/checkout@v4
      - name: Stage and verify exact F1n originals
        shell: bash
        run: |
          set -euo pipefail
          ROOT="ARCHIVES 8-30-2026/SGG/sggweb"
          mkdir -p transfer
          cp "$ROOT/SGGF1.666f1n_SOURCE.zip" transfer/
          cp "$ROOT/SGGF1.666f1n_COMPLETE_CLOUDFLARE_SITE.zip" transfer/
          cp "$ROOT/pics/wildsf1n.png" transfer/
          test -s transfer/SGGF1.666f1n_SOURCE.zip
          test -s transfer/SGGF1.666f1n_COMPLETE_CLOUDFLARE_SITE.zip
          test -s transfer/wildsf1n.png
          unzip -t transfer/SGGF1.666f1n_SOURCE.zip
          unzip -t transfer/SGGF1.666f1n_COMPLETE_CLOUDFLARE_SITE.zip
          sha256sum transfer/* > transfer/SHA256SUMS.txt
          stat -c '%n %s bytes' transfer/* > transfer/SIZES.txt
          file transfer/*
      - name: Upload original packages and reference image
        uses: actions/upload-artifact@v4
        with:
          name: SGGF1n-wilds-baseline-transfer
          path: transfer/
          if-no-files-found: error
          retention-days: 1
