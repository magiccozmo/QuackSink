name: Luma SGGM1.4 baseline transfer

on:
  push:
    branches:
      - luma-sggm15-m14-transfer-20261117

permissions:
  contents: read
  actions: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact transfer branch
        uses: actions/checkout@v4
        with:
          ref: luma-sggm15-m14-transfer-20261117

      - name: Copy and verify M1.4 baseline archives
        shell: bash
        run: |
          set -euo pipefail
          SRC="ARCHIVES 8-30-2026/SGG/sggweb"
          mkdir -p /tmp/sggm14-transfer
          cp "$SRC/SGGM1.4_SOURCE.zip" /tmp/sggm14-transfer/
          cp "$SRC/SGGM1.4_COMPLETE_CLOUDFLARE_SITE.zip" /tmp/sggm14-transfer/
          cp "$SRC/SGGM1.4_BUILD_META.json" /tmp/sggm14-transfer/
          cp "$SRC/SGGM1.4_TEST_RESULTS.txt" /tmp/sggm14-transfer/
          cp "$SRC/SGGM1.4_LUMA_LOG_Entry055.txt" /tmp/sggm14-transfer/
          cd /tmp/sggm14-transfer
          test -s SGGM1.4_SOURCE.zip
          test -s SGGM1.4_COMPLETE_CLOUDFLARE_SITE.zip
          unzip -t SGGM1.4_SOURCE.zip
          unzip -t SGGM1.4_COMPLETE_CLOUDFLARE_SITE.zip
          sha256sum *.zip > SHA256SUMS.txt
          stat -c '%n %s bytes' * > FILE_SIZES.txt
          cat SHA256SUMS.txt
          cat FILE_SIZES.txt

      - name: Upload original baseline archives
        uses: actions/upload-artifact@v4
        with:
          name: SGGM1.4-baseline-transfer
          path: /tmp/sggm14-transfer/
          if-no-files-found: error
          retention-days: 1
