name: Temporary Clean2.4 baseline export

on:
  push:
    branches:
      - temp/export-clean24-baseline

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact Clean2.4 baseline ZIPs from immutable commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sgg-transfer
          BASE="https://raw.githubusercontent.com/magiccozmo/QuackSink/cac6ad23214c6dfdec0d27dd8dd56bd04f546dfb/ARCHIVES%208-30-2026/SGG/sggweb"
          curl -fL --retry 3 "$BASE/SGGF1Clean2.4_SOURCE.zip" -o /tmp/sgg-transfer/SGGF1Clean2.4_SOURCE.zip
          curl -fL --retry 3 "$BASE/SGGF1Clean2.4_COMPLETE_CLOUDFLARE_SITE.zip" -o /tmp/sgg-transfer/SGGF1Clean2.4_COMPLETE_CLOUDFLARE_SITE.zip
          test -s /tmp/sgg-transfer/SGGF1Clean2.4_SOURCE.zip
          test -s /tmp/sgg-transfer/SGGF1Clean2.4_COMPLETE_CLOUDFLARE_SITE.zip
          unzip -tq /tmp/sgg-transfer/SGGF1Clean2.4_SOURCE.zip
          unzip -tq /tmp/sgg-transfer/SGGF1Clean2.4_COMPLETE_CLOUDFLARE_SITE.zip
          (cd /tmp/sgg-transfer && sha256sum *.zip > SHA256SUMS.txt && stat -c '%n %s bytes' *.zip > FILE_SIZES.txt)
          cat /tmp/sgg-transfer/SHA256SUMS.txt
          cat /tmp/sgg-transfer/FILE_SIZES.txt
      - name: Upload binary transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SGGF1Clean2.4-baseline-transfer
          path: /tmp/sgg-transfer/*
          retention-days: 1
          if-no-files-found: error
