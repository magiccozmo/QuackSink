name: Temporary Clean2.4 baseline export

on:
  push:
    branches:
      - temp/export-clean24-baseline

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact Clean2.4 baseline
        uses: actions/checkout@v4
        with:
          ref: cac6ad23214c6dfdec0d27dd8dd56bd04f546dfb
      - name: Stage and verify original ZIPs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sgg-transfer
          cp "ARCHIVES 8-30-2026/SGG/sggweb/SGGF1Clean2.4_SOURCE.zip" /tmp/sgg-transfer/
          cp "ARCHIVES 8-30-2026/SGG/sggweb/SGGF1Clean2.4_COMPLETE_CLOUDFLARE_SITE.zip" /tmp/sgg-transfer/
          test -s /tmp/sgg-transfer/SGGF1Clean2.4_SOURCE.zip
          test -s /tmp/sgg-transfer/SGGF1Clean2.4_COMPLETE_CLOUDFLARE_SITE.zip
          unzip -tq /tmp/sgg-transfer/SGGF1Clean2.4_SOURCE.zip
          unzip -tq /tmp/sgg-transfer/SGGF1Clean2.4_COMPLETE_CLOUDFLARE_SITE.zip
          (cd /tmp/sgg-transfer && sha256sum *.zip > SHA256SUMS.txt && stat -c '%n %s bytes' *.zip > FILE_SIZES.txt)
          cat /tmp/sgg-transfer/SHA256SUMS.txt
          cat /tmp/sgg-transfer/FILE_SIZES.txt
      - name: Upload binary transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SGGF1Clean2.4-baseline-transfer
          path: /tmp/sgg-transfer/*
          retention-days: 1
          if-no-files-found: error
