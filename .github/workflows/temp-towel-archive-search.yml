      - name: Search actual archived conversations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path("ARCHIVES 8-30-2026")
pattern = re.compile(r'(?i)mystical|guessing.{0,60}game|game.{0,60}guessing|qbasic|gw[- ]?basic|BASIC.{0,60}guess|guess.{0,60}BASIC')
          hits = []
          for path in root.rglob("*.CONVO"):
              try:
                  data = path.read_text(encoding="utf-8", errors="replace")
              except Exception:
                  continue
              for match in pattern.finditer(data):
                  start = max(0, match.start()-450)
                  end = min(len(data), match.end()+650)
                  hits.append(f"FILE: {path}\\nMATCH: {data[start:end]}\\n{'='*70}")
          out = "\\n".join(hits) if hits else "NO MATCHES FOUND"
          Path("mystical-guessing-search.txt").write_text(out, encoding="utf-8")
          print(out[:20000])
          PY

      - name: Upload search findings
        uses: actions/upload-artifact@v4
        with:
          name: mystical-guessing-search
          path: mystical-guessing-search.txt
          if-no-files-found: error
          retention-days: 1
