name: Luma SGGM1.3 exact M1.1 baseline transfer

on:
  push:
    branches:
      - luma-sggm13-baseline-transfer-20261117
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact baseline repository
        uses: actions/checkout@v4
      - name: Stage the specified M1.1 archives
        shell: bash
        run: |
          set -euo pipefail
          SRC="ARCHIVES 8-30-2026/SGG/sggweb"
          mkdir -p transfer
          cp "$SRC/SGGM1.1_SOURCE.zip" transfer/
          cp "$SRC/SGGM1.1_COMPLETE_CLOUDFLARE_SITE.zip" transfer/
          test -s transfer/SGGM1.1_SOURCE.zip
          test -s transfer/SGGM1.1_COMPLETE_CLOUDFLARE_SITE.zip
          unzip -t transfer/SGGM1.1_SOURCE.zip
          unzip -t transfer/SGGM1.1_COMPLETE_CLOUDFLARE_SITE.zip
          sha256sum transfer/*.zip | tee transfer/SHA256SUMS.txt
          stat -c '%n %s bytes' transfer/*.zip | tee transfer/SIZES.txt
      - name: Upload original archives
        uses: actions/upload-artifact@v4
        with:
          name: SGGM1.1-baseline-transfer
          path: transfer/
          if-no-files-found: error
          retention-days: 1
