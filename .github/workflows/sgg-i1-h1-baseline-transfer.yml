name: Temporary SGGH1.0 baseline transfer for I1.0

on:
  push:
    branches:
      - tmp/sgg-i1-h1-base-transfer-20261107

permissions:
  contents: read

jobs:
  export-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out only the exact H1.0 archives
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            ARCHIVES 8-30-2026/SGG/sggweb/SGGH1.0_SOURCE.zip
            ARCHIVES 8-30-2026/SGG/sggweb/SGGH1.0_COMPLETE_CLOUDFLARE_SITE.zip
          sparse-checkout-cone-mode: false

      - name: Stage and verify H1.0 archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          cp "ARCHIVES 8-30-2026/SGG/sggweb/SGGH1.0_SOURCE.zip" transfer/
          cp "ARCHIVES 8-30-2026/SGG/sggweb/SGGH1.0_COMPLETE_CLOUDFLARE_SITE.zip" transfer/
          test -s transfer/SGGH1.0_SOURCE.zip
          test -s transfer/SGGH1.0_COMPLETE_CLOUDFLARE_SITE.zip
          unzip -t transfer/SGGH1.0_SOURCE.zip
          unzip -t transfer/SGGH1.0_COMPLETE_CLOUDFLARE_SITE.zip
          unzip -l transfer/SGGH1.0_SOURCE.zip > transfer/SOURCE_INVENTORY.txt
          unzip -l transfer/SGGH1.0_COMPLETE_CLOUDFLARE_SITE.zip > transfer/SITE_INVENTORY.txt
          sha256sum transfer/*.zip | tee transfer/SHA256SUMS.txt
          stat -c '%n %s bytes' transfer/*.zip | tee transfer/FILE_SIZES.txt

      - name: Upload temporary baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: SGGH1.0-baseline-transfer-for-I1.0
          path: transfer/
          retention-days: 1
          if-no-files-found: error
