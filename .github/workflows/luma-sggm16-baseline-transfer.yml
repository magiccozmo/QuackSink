name: Luma SGGM1.6 baseline and K1.12 asset transfer

on:
  push:
    branches:
      - luma-sggm16-baseline-transfer-20261118

permissions:
  contents: read
  actions: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse checkout exact M1.5 and K1.12 archives
        uses: actions/checkout@v4
        with:
          ref: luma-sggm16-baseline-transfer-20261118
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ARCHIVES 8-30-2026/SGG/sggweb/SGGM1.5_SOURCE.zip
            ARCHIVES 8-30-2026/SGG/sggweb/SGGM1.5_COMPLETE_CLOUDFLARE_SITE.zip
            ARCHIVES 8-30-2026/SGG/sggweb/SGGK1.12_SOURCE.zip
            ARCHIVES 8-30-2026/SGG/sggweb/SGGK1.12_COMPLETE_CLOUDFLARE_SITE.zip
          sparse-checkout-cone-mode: false

      - name: Copy and verify baseline archives
        shell: bash
        run: |
          set -euo pipefail
          SRC="ARCHIVES 8-30-2026/SGG/sggweb"
          mkdir -p /tmp/sggm16-transfer
          for f in SGGM1.5_SOURCE.zip SGGM1.5_COMPLETE_CLOUDFLARE_SITE.zip SGGK1.12_SOURCE.zip SGGK1.12_COMPLETE_CLOUDFLARE_SITE.zip; do
            test -s "$SRC/$f"
            cp "$SRC/$f" /tmp/sggm16-transfer/
            unzip -t "/tmp/sggm16-transfer/$f"
          done
          cd /tmp/sggm16-transfer
          sha256sum *.zip > SHA256SUMS.txt
          stat -c '%n %s bytes' * > FILE_SIZES.txt
          cat SHA256SUMS.txt
          cat FILE_SIZES.txt

      - name: Upload original archives
        uses: actions/upload-artifact@v4
        with:
          name: SGGM1.5-K1.12-baselines
          path: /tmp/sggm16-transfer/
          if-no-files-found: error
          retention-days: 1
