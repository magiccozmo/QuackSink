name: Temporary M1.0a baseline transfer

on:
  push:
    branches:
      - luma-m11-baseline-transfer

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse checkout exact M1.0a baseline archives
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            ARCHIVES 8-30-2026/SGG/sggweb/SGGM1.0a_SOURCE.zip
            ARCHIVES 8-30-2026/SGG/sggweb/SGGM1.0a_COMPLETE_CLOUDFLARE_SITE.zip
          sparse-checkout-cone-mode: false

      - name: Verify and stage original M1.0a archives
        shell: bash
        run: |
          set -euo pipefail
          ROOT="ARCHIVES 8-30-2026/SGG/sggweb"
          SOURCE="$ROOT/SGGM1.0a_SOURCE.zip"
          SITE="$ROOT/SGGM1.0a_COMPLETE_CLOUDFLARE_SITE.zip"
          test -s "$SOURCE"
          test -s "$SITE"
          unzip -tq "$SOURCE"
          unzip -tq "$SITE"
          mkdir -p transfer
          cp "$SOURCE" "$SITE" transfer/
          (
            cd transfer
            sha256sum SGGM1.0a_SOURCE.zip SGGM1.0a_COMPLETE_CLOUDFLARE_SITE.zip > SHA256SUMS.txt
            wc -c SGGM1.0a_SOURCE.zip SGGM1.0a_COMPLETE_CLOUDFLARE_SITE.zip > FILE_SIZES.txt
          )
          cat transfer/SHA256SUMS.txt
          cat transfer/FILE_SIZES.txt

      - name: Upload verified source and deployment archives
        uses: actions/upload-artifact@v4
        with:
          name: SGGM1.0a-baseline-transfer
          path: transfer/*
          if-no-files-found: error
          retention-days: 1
