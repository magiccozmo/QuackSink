name: Temporary PPR 1.93b source transfer
on:
  push:
    branches:
      - luma/ppr-193b-source-transfer-20261120
permissions:
  contents: read
  actions: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact source from raw GitHub
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          URL="https://raw.githubusercontent.com/magiccozmo/QuackSink/main/ARCHIVES%208-30-2026/PPR_Nov%2020%202026%2002_17_18_PM_v1.93a/PPR1.93a.py"
          curl --fail --location --retry 3 "$URL" --output transfer/PPR1.93b.py
          test -s transfer/PPR1.93b.py
          wc -c transfer/PPR1.93b.py | tee transfer/SOURCE_SIZE.txt
          sha256sum transfer/PPR1.93b.py | tee transfer/SOURCE_SHA256.txt
          head -n 12 transfer/PPR1.93b.py
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: PPR-1.93b-exact-source
          path: transfer/
          if-no-files-found: error
          retention-days: 1
