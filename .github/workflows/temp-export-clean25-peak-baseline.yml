name: Temporary Entry010 Log Export
on:
  push:
    branches:
      - temp/export-clean25-peak-baseline
permissions:
  contents: read
jobs:
  export-log:
    runs-on: ubuntu-latest
    steps:
      - name: Download the exact cumulative log from pinned main commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          BASE="64324a4da16300390af72972b24c1eae54fbf4d1"
          ROOT="https://raw.githubusercontent.com/magiccozmo/QuackSink/${BASE}/ARCHIVES%208-30-2026/SGG/sggweb"
          curl -fL "${ROOT}/lumas_log_Entry010.txt" -o transfer/lumas_log_Entry010.txt
          test -s transfer/lumas_log_Entry010.txt
          sha256sum transfer/lumas_log_Entry010.txt > transfer/SHA256SUMS.txt
          stat -c '%n %s bytes' transfer/lumas_log_Entry010.txt > transfer/FILE_SIZES.txt
      - name: Transfer cumulative log
        uses: actions/upload-artifact@v4
        with:
          name: entry010-log-transfer
          path: transfer/
          retention-days: 1
