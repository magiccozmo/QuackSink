name: Temporary Clean2.7 baseline export
on:
  push:
    branches:
      - temp/export-clean27-baseline-20261103
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact pinned Clean2.7 archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          BASE="https://raw.githubusercontent.com/magiccozmo/QuackSink/1c06af037d0ab95a2ce9f126e0273b3372df1f25/ARCHIVES%208-30-2026/SGG/sggweb"
          curl -fL --retry 3 "$BASE/SGGF1Clean2.7_SOURCE.zip" -o stage/SGGF1Clean2.7_SOURCE.zip
          curl -fL --retry 3 "$BASE/SGGF1Clean2.7_COMPLETE_CLOUDFLARE_SITE.zip" -o stage/SGGF1Clean2.7_COMPLETE_CLOUDFLARE_SITE.zip
          test -s stage/SGGF1Clean2.7_SOURCE.zip
          test -s stage/SGGF1Clean2.7_COMPLETE_CLOUDFLARE_SITE.zip
          unzip -tq stage/SGGF1Clean2.7_SOURCE.zip
          unzip -tq stage/SGGF1Clean2.7_COMPLETE_CLOUDFLARE_SITE.zip
          (cd stage && sha256sum *.zip > SHA256SUMS.txt && stat -c '%n %s bytes' *.zip > FILE_SIZES.txt)
          cat stage/SHA256SUMS.txt
          cat stage/FILE_SIZES.txt
      - name: Preserve originals in a short-lived artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clean2.7-exact-baseline-transfer
          path: stage/
          retention-days: 1
